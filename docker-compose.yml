version: '3.8'
name: Note-It - Production

services:
  # todo -> replace with mariadb
  mysql:
    image: mysql:8.0
    container_name: note-it-mysql
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=note_it
      - MYSQL_USER=note_it_user
      - MYSQL_PASSWORD=note_it_password
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - note-it-network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - APP_PORT=3000
      - APP_HOST=localhost
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - DB_NAME=note_it
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - note-it-network
    healthcheck:
      test: ['CMD', 'curl', '-qf', 'http://localhost:3000/api']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # adminer:
  #   image: adminer:latest
  #   container_name: note-it-adminer
  #   restart: unless-stopped
  #   ports:
  #     - '8080:8080'
  #   environment:
  #     - ADMINER_DEFAULT_SERVER=mysql
  #     - ADMINER_PLUGINS=tables-filter
  #   depends_on:
  #     - mysql
  #   networks:
  #     - note-it-network

  redis:
    image: redis:7-alpine
    container_name: note-it-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - note-it-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db-data:
  redis-data:

networks:
  note-it-network:
