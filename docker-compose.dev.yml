version: '3.8'
name: Note-It - Production
include:
  - ./docker-compose.yml

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=note_it
      - MYSQL_USER=note_it_user
      - MYSQL_PASSWORD=note_it_password
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - note-it
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password

  app:
    ports:
      - '3000:3000'

  db-panel:
    image: adminer:latest
    container_name: note-it-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      - ADMINER_DEFAULT_SERVER=db
      - ADMINER_PLUGINS=tables-filter
    depends_on:
      - db
    networks:
      - note-it

  redis:
    ports:
      - '6379:6379'
